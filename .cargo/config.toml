# Счётчики блоков собранной программы (`блоков выдано N, живо M` в stderr)
# печатаются только по `ADAMAS_STATS`: вывод программы принадлежит ей. Свидетели
# течи и reuse читают их у каждого запущенного бинаря, и переменная ставится
# здесь - одна на всю сюиту и все бенчмарки, в Nix и без него.
[env]
ADAMAS_STATS = "1"
