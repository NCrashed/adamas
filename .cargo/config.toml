# Счётчики блоков собранной программы (`блоков выдано N, живо M` в stderr)
# печатаются только по `ADAMAS_STATS`: вывод программы принадлежит ей. Свидетели
# течи и reuse читают их у каждого запущенного бинаря, и переменная ставится
# здесь - одна на всю сюиту и все бенчмарки, в Nix и без него.
[env]
ADAMAS_STATS = "1"
# Язык сообщений (§7.6): снимки написаны по-русски, и прогон не должен
# зависеть от локали машины. Английский проверяют свои тесты.
ADAMAS_LANG = "ru"
# Стек тестовых потоков (§10 вопрос 187): тот же, что у драйвера и сервера
# (`adamas_elab::STACK`, 64 МиБ). Сумма пределов языка помещается в него по
# построению, и `adamas-codegen/tests/depth.rs` сверяет, что число здесь то же.
RUST_MIN_STACK = "67108864"
