name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Формат и линты гоняются один раз: они платформенно-независимы.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия не задаётся в workflow: rustup берёт её из rust-toolchain.toml,
      # того же файла, что читает flake.nix.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Матрица платформ — требование §9 Фазы 0.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets
      # --all-targets не включает doc-tests, поэтому отдельным шагом.
      - run: cargo test --locked --workspace --doc

  # MSRV объявлен в Cargo.toml (workspace.package.rust-version) и clippy.toml.
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN перебивает rust-toolchain.toml. Без него rustup поднял бы
    # 1.98.0 и проверка MSRV была бы фикцией.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  # Бенчмарки не измеряются: раннер слишком шумный, чтобы число что-то значило.
  # Но собираться и отрабатывать один прогон они обязаны.
  bench-smoke:
    name: bench compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --workspace -- --test
