# Манифест корпуса `eval` (§7.1, §5.3).
#
# Корпус - проект, и нужен манифест ровно ради секции `[link]`. Машина ищет
# чужой символ `dlopen`'ом по тем же библиотекам, по которым его ищет
# компоновщик, и читает она **этот** список; одиночному файлу его взять
# неоткуда. Без манифеста `zlib` не позвать ни `adamas eval`, ни срезу - то
# есть договор трёх вычислителей на настоящей библиотеке не проверить вовсе.
#
# Библиотеки корпуса поэтому один список на всех, и читают его трое: `adamas
# eval` через `project::opened`, и оба понижения через
# `adamas-codegen/tests/harness`. Второй копии нет намеренно - разъехавшись,
# она дала бы «символ не найден» у одного из трёх.
#
# `libc` с `libm` здесь не написаны: их подключает сишный компилятор сам, и
# машина держит их неявным списком (`adamas_interp::foreign::C_LIBRARY`).

# Модуля-входа у корпуса нет: программы его - сотня самостоятельных файлов, и
# драйвер каждую открывает по имени файла, а не через `entry`. Написан он
# потому, что поле обязательное по форме, и указывает на несуществующий модуль
# сознательно: собирать корпус как одну программу нечем и незачем.
[package]
name = "eval"
root = "."
entry = "Corpus"

[link]
libraries = ["z", "curl", "SDL2"]
