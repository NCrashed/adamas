[package]
name = "adamas-lsp"
description = "Adamas language server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "adamas_lsp"
path = "src/lib.rs"
bench = false

[[bin]]
name = "adamas-lsp"
path = "src/main.rs"
bench = false

[dependencies]
adamas-core.workspace = true
adamas-elab.workspace = true
anyhow = "1"
# Каркас JSON-RPC от rust-analyzer: рамка сообщений, потоки чтения и записи,
# рукопожатие `initialize`/`shutdown`. Синхронный и крошечный - ровно под
# перепроверку файла целиком, которой не нужны ни отмена, ни async.
lsp-server = "0.10"
# Типы протокола. Своя запись `Diagnostic`, `Position`, `ServerCapabilities`
# была бы второй копией спецификации, и разъезжалась бы с ней молча.
lsp-types = "0.97"
serde_json = "1"

[dev-dependencies]
proptest = "1"
