[workspace]
resolver = "3"
members = [
    "crates/adamas-core",
    "crates/adamas-parser",
    "crates/adamas-elab",
    "crates/adamas-interp",
    "crates/adamas-cli",
    "crates/adamas-lsp",
    # Учебный крейт Фазы 0 (§9). Удаляется вместе с этой строкой.
    "crates/adamas-warmup-stlc",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV. Нижняя граница задана edition 2024 (требует 1.85), что выше
# стартового ориентира §9 «1.80+». Проверяется отдельным CI-job'ом.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Anton Gushcha <ncrashed@protonmail.com>"]
repository = "https://github.com/NCrashed/adamas"

[workspace.dependencies]
adamas-core = { path = "crates/adamas-core", version = "0.0.0" }
adamas-parser = { path = "crates/adamas-parser", version = "0.0.0" }
adamas-elab = { path = "crates/adamas-elab", version = "0.0.0" }
adamas-interp = { path = "crates/adamas-interp", version = "0.0.0" }

# Строгие defaults (CONTRIBUTING.md, «Стиль кода»).
[workspace.lints.rust]
# deny, а не forbid: рантайм (Perceus RC, SIMD, FFI — §5) без unsafe не
# обойдётся, а forbid не перебивается локальным `#[allow]`.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# «Не panic'уй на пользовательских ошибках» — в тестах разрешено через
# clippy.toml (allow-unwrap-in-tests / allow-expect-in-tests).
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Release + debuginfo: для perf/flamegraph, не ломая оптимизации.
# Соответствует build mode «profile» из §7.1, но на уровне cargo.
[profile.profiling]
inherits = "release"
debug = true
