# Свидетели «аллоцировал на воркере» мерят планировщик: ответ у них один при
# любом раскладе, а утверждают они, что хоть один прогон ушёл на второй воркер.
# Под нагрузкой гейта, где корпусные тесты держат все ядра, рантайм вправе
# досчитать всё на одном, и свидетель краснеет без дефекта.
#
# Лечится причина, а не симптом: свидетель получает машину целиком
# (`threads-required`) - соседи ждут его, а не толкаются с ним. Повтор
# остаётся страховкой, а не правилом: под одними повторами капстоун падал
# через прогон, и попытка стоила до 160 с вместо 20. Регресса он не прячет:
# однопоточный круг не уходит на воркер ни в одной попытке.
[[profile.default.overrides]]
filter = 'package(adamas-codegen) & test(/several_workers|several_threads|across_the_workers/)'
threads-required = "num-test-threads"
retries = 3

# Ещё два свидетеля, которым нужна свободная машина: отношение времени
# восьмикратной работы к однократной (линия против квадрата) и санитайзер,
# обязанный поймать гонку мутанта - гонка случается, только когда потоки
# действительно бегут одновременно.
[[profile.default.overrides]]
filter = 'package(adamas-codegen) & test(/an_operation_under_recursion_stays_linear|the_sanitizer_is_silent_on_a_corpus_program_too/)'
threads-required = "num-test-threads"
retries = 3
