[package]
name = "adamas-cli"
description = "Adamas compiler driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# bench = false — по той же причине, что в adamas-core.
[[bin]]
name = "adamas"
path = "src/main.rs"
bench = false

[[bench]]
name = "startup"
harness = false

[dependencies]
adamas-codegen.workspace = true
adamas-core.workspace = true
adamas-elab.workspace = true
adamas-interp.workspace = true
adamas-parser.workspace = true
adamas-pkg.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# Только ради `tests/lsp.rs`: сверка «текст в редакторе = текст в терминале»
# живёт здесь, потому что путь к бинарю `adamas` знают лишь тесты его пакета.
adamas-lsp.workspace = true
criterion = "0.7"
insta = "1"
