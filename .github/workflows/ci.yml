name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Формат и линты гоняются один раз: они платформенно-независимы.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия не задаётся в workflow: rustup берёт её из rust-toolchain.toml,
      # того же файла, что читает flake.nix.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Матрица платформ — требование §9 Фазы 0.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            llvm: "18"
            editors: "yes"
          # LLVM в образе macOS не гарантирован, и договор третьего вычислителя
          # там объявлен непроверяемым — единственное место, где это объявлено.
          # Молчаливый пропуск был бы обманчивым свидетелем: тест без
          # инструментов падает, а не зеленеет.
          #
          # Редакторы объявлены отсутствующими там же, и это не «они работают
          # и так»: на macOS плагины не проверяются вовсе. Цена второй ноги —
          # Electron и Neovim на каждый прогон; находка неизвестна. Объявлено,
          # чтобы молчания не было, и названо в плане волны.
          - os: macos-14
            llvm: ""
            editors: ""
    env:
      ADAMAS_LLVM: ${{ matrix.llvm == '' && 'absent' || '' }}
      ADAMAS_LLVM_BIN: ${{ matrix.llvm != '' && format('/usr/lib/llvm-{0}/bin', matrix.llvm) || '' }}
      ADAMAS_LLVM_MIN_BIN: ${{ matrix.llvm != '' && format('/usr/lib/llvm-{0}/bin', matrix.llvm) || '' }}
      # Рантайм битовым кодом (трек A′): gcc его не выдаёт, а версия обязана
      # совпасть с той, чей `llvm-link` его читает.
      ADAMAS_CLANG: ${{ matrix.llvm != '' && format('/usr/lib/llvm-{0}/bin/clang', matrix.llvm) || '' }}
      # Редакторы Фазы 9 (трек C). `absent` — то же объявленное отсутствие, что
      # у LLVM. Пути ubuntu берутся из раскладки пакетов, поставленных ниже:
      # у VSCodium это Electron `/usr/share/codium/codium` и CLI
      # `/usr/share/codium/bin/codium` — разные бинари с разными обязанностями,
      # подмена в любую сторону измерена и не работает.
      ADAMAS_NVIM: ${{ matrix.editors == '' && 'absent' || 'nvim' }}
      ADAMAS_VSCODE: ${{ matrix.editors == '' && 'absent' || '/usr/share/codium/codium' }}
      ADAMAS_VSCODE_CLI: ${{ matrix.editors == '' && 'absent' || '/usr/share/codium/bin/codium' }}
      ADAMAS_VSCE: ${{ matrix.editors == '' && 'absent' || 'vsce' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Минимальная поддерживаемая версия (adamas-codegen::llvm::MINIMUM_MAJOR).
      # Обе переменные указывают на неё: треугольник чтения `.ll` этим прогоном
      # не проверяется, и тест печатает об этом сам.
      # gdb рядом с LLVM: критерий трека E - утверждение про сеанс отладчика, и
      # проверяет его `gdb --batch`. Отсутствие отладчика роняет прогон, а не
      # пропускает проверку, - поэтому он ставится там же, где инструменты.
      - if: matrix.llvm != ''
        run: sudo apt-get update && sudo apt-get install -y llvm-${{ matrix.llvm }} clang-${{ matrix.llvm }} gdb
      # Редакторы трека C. Версии прибиты и совпадают с теми, что даёт флейк:
      # в CI Nix не поднимается (закачка dev-shell дороже всего прогона), и
      # второй записи версий избежать нечем — как у LLVM, где мажор назван и в
      # `flake.nix`, и в матрице.
      #
      # Neovim архивом, а не `apt`: в образе ubuntu-24.04 он 0.9.x, а
      # проверяется свидетель на 0.12.4, и разъехаться этим двум нечем, кроме
      # как молча.
      - if: matrix.editors != ''
        name: редакторы для свидетелей трека C
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          curl -fsSL -o /tmp/codium.deb \
            https://github.com/VSCodium/vscodium/releases/download/1.126.04524/codium_1.126.04524_amd64.deb
          sudo apt-get install -y /tmp/codium.deb
          npm install -g @vscode/vsce@3.9.2
          npm ci --prefix editors/vscode
          nvim --version | head -1
          test -x /usr/share/codium/codium
          test -x /usr/share/codium/bin/codium
      - run: cargo test --locked --workspace --all-targets
      # --all-targets не включает doc-tests, поэтому отдельным шагом.
      - run: cargo test --locked --workspace --doc

  # MSRV объявлен в Cargo.toml (workspace.package.rust-version) и clippy.toml.
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    # RUSTUP_TOOLCHAIN перебивает rust-toolchain.toml. Без него rustup поднял бы
    # 1.98.0 и проверка MSRV была бы фикцией.
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  # Бенчмарки не измеряются: раннер слишком шумный, чтобы число что-то значило.
  # Но собираться и отрабатывать один прогон они обязаны.
  bench-smoke:
    name: bench compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --workspace -- --test
