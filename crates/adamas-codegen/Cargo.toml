[package]
name = "adamas-codegen"
description = "Adamas backend: core terms to backend IR to portable C and LLVM IR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "native"
harness = false

# Нагрузки трека Z, кроме символьной. Отдельной целью, а не группами в
# `native`: строка таблицы обязана воспроизводиться одной командой, а фильтр
# criterion гасит точки, но не парный замер вокруг них.
[[bench]]
name = "workloads"
harness = false

# Капстоун против соседа на C с intrinsics: милестоун Фазы 7.
[[bench]]
name = "capstone"
harness = false

# Цена уклада чужого указателя на границе Adamas<->C: трек A волны 1 Фазы 8.
# Отдельной целью, потому что нагрузка у него не корпусная программа, а чужая
# единица трансляции, и строка сборки у неё своя.
[[bench]]
name = "foreign"
harness = false

# Цена пересечения через настоящий узел `Expr::Foreign`: трек D той же волны.
# Отдельно от `foreign`, потому что мерит другое: тот стенд считает цену
# **уклада** на границе, написанной руками, этот - цену **вызова**, напечатанного
# эмиттерами из программы на Adamas.
[[bench]]
name = "crossing"
harness = false

# Цена границы **замыкания**: трек B волны 3 Фазы 8, вопрос 189. Отдельно от
# `crossing`, потому что за границу не ходит вовсе: там чужой кадр, здесь свой
# трамплин, и общего у стендов только счётчик витков.
[[bench]]
name = "closure"
harness = false

[dependencies]
adamas-core.workspace = true
# Ради заголовка и договора: генерируемый C собирается против этого рантайма, а
# путь к `adamas.h` приходит через `DEP_ADAMAS_RUNTIME_INCLUDE` (ключ `links`).
adamas-runtime.workspace = true
thiserror = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
adamas-elab.workspace = true
adamas-interp.workspace = true
adamas-parser.workspace = true
# Манифест корпуса (`tests/golden/eval/adamas.toml`): секцию `[link]` читают и
# машина, и обе сборки свидетеля. Второй список библиотек здесь разъехался бы с
# первым молча - и разошёлся бы «символ не найден» у одного из трёх.
adamas-pkg.workspace = true
criterion = "0.7"
